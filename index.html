<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tic Tac Toe</title>
<style>
:root{--g:#4fb58c;--gd:#3a9d75;--ink:#2b3440;--mute:#9aa5a0;--card:#fff;--bg1:#6fbf9a;--bg2:#8fcfa8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;outline:none}
html,body{height:100%}
body{font-family:Inter,"Segoe UI",Roboto,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden;-webkit-user-select:none;user-select:none}
body:before,body:after{content:"";position:fixed;border-radius:50%;z-index:0}
body:before{width:70vmax;height:70vmax;left:-30vmax;top:-34vmax;background:#c6d97a;opacity:.45}
body:after{width:60vmax;height:60vmax;right:-34vmax;bottom:-26vmax;background:#a9d6e8;opacity:.4}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
.app{position:relative;z-index:1;height:100%;height:100dvh;max-width:430px;margin:0 auto;padding:18px 16px;display:flex}
.panel{flex:1;background:rgba(255,255,255,.92);border-radius:22px;box-shadow:0 18px 50px rgba(30,90,65,.18);padding:20px 18px 22px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.view{display:none;flex:1;flex-direction:column;min-height:0;overflow-y:auto}
.view.on{display:flex;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.top h1{font-size:19px;font-weight:600;letter-spacing:.2px}
.ic{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{position:relative;height:118px;background:var(--card);border-radius:14px;box-shadow:0 8px 22px rgba(60,100,85,.10);text-align:left;padding:14px;display:flex;align-items:flex-end;font-size:14.5px;font-weight:600;transition:transform .15s,opacity .3s,box-shadow .2s}
.card:active{transform:scale(.96)}
.card .ci{position:absolute;right:12px;top:12px;width:26px;height:26px;stroke:#c3cbc8;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.locked .card{opacity:.55}
.card.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.info{margin-top:26px;border-top:1px solid #e6ece9;max-height:0;opacity:0;overflow:hidden;transition:max-height .5s ease,opacity .4s ease,margin .4s}
.info.show{max-height:200px;opacity:1}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid #eef2f0;font-size:14px}
.row:last-child{border-bottom:0}
.row span{color:var(--mute);font-size:13px}
.row b{font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);margin-right:7px;box-shadow:0 0 0 4px rgba(79,181,140,.18)}
.spacer{flex:1}
.cta{width:100%;height:52px;border-radius:12px;background:var(--g);color:#fff;font-size:15px;font-weight:600;box-shadow:0 10px 22px rgba(79,181,140,.4);transition:transform .15s,opacity .35s,max-height .35s,margin .35s}
.cta:active{transform:scale(.97)}
.cta.gone{opacity:0;pointer-events:none;transform:translateY(10px)}
/* modal */
.ov{position:fixed;inset:0;z-index:20;background:rgba(30,50,42,.38);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.top{align-items:flex-start;padding-top:10dvh}
.ov.on{opacity:1;pointer-events:auto}
.box{width:100%;max-width:370px;background:#fff;border-radius:22px;padding:24px 20px 20px;box-shadow:0 24px 60px rgba(0,0,0,.25);transform:scale(.95) translateY(10px);transition:transform .3s cubic-bezier(.2,.9,.3,1.1);position:relative}
.ov.on .box{transform:none}
.box h2{font-size:18px;font-weight:600;text-align:center}
.box p.s{font-size:13px;color:var(--mute);text-align:center;margin:6px 0 20px}
.x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;color:var(--mute);font-size:20px;z-index:3}
.id{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.6vw,7px)}
.id .b{width:clamp(28px,9.4vw,36px);height:clamp(40px,12.6vw,48px);border:1.5px solid #dfe6e2;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;background:#f8faf9;transition:border-color .18s,background .18s,box-shadow .18s}
.id .b.act{border-color:var(--g);background:#fff;box-shadow:0 0 0 3px rgba(79,181,140,.16)}
.id i{font-style:normal;color:var(--mute);font-size:20px;font-weight:600;padding:0 1px}
.id input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;background:none;caret-color:transparent;color:transparent;-webkit-user-select:text;user-select:text}
.id.err .b{border-color:#e46a6a;animation:shake .35s}
.msg{min-height:18px;margin:12px 0 4px;text-align:center;font-size:12.5px;color:#d85a5a}
.cta[disabled]{background:#c9d8d1;box-shadow:none;cursor:default}
/* level page */
.lh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.sq{width:48px;height:48px;border-radius:14px;background:#fff;box-shadow:0 6px 16px rgba(60,100,85,.12);display:flex;align-items:center;justify-content:center;flex:none}
.sq .ic{stroke:var(--g);width:22px;height:22px}
.gi{background:linear-gradient(145deg,#ff9a76,#f0705a)}
.gi .ic{stroke:#fff}
.lh small{display:block;color:var(--mute);font-size:13px}
.lh strong{font-size:20px;font-weight:600}
.dial{position:relative;width:min(72vw,36dvh,300px);aspect-ratio:1;margin:14px auto 6px;container-type:inline-size;flex:none}
.dial svg{position:absolute;inset:0;width:100%;height:100%}
.t{stroke:#d9e3df;stroke-width:3.4;stroke-linecap:round;transition:stroke .35s ease}
.t.on{stroke:#5fb3a0}
.dial .c{position:absolute;inset:20%;border-radius:50%;background:#fff;box-shadow:0 0 0 4cqw #f4f8f6;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .c b{font-size:21cqw;font-weight:600;line-height:1}
.dial .c span{font-size:4.6cqw;color:var(--mute);margin-top:2cqw}
.lp{text-align:center;font-weight:600;font-size:16px;margin:12px 0 16px}
.track{display:flex;align-items:flex-start;gap:8px}
.end{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;color:var(--mute);font-size:12.5px}
.flag{width:46px;height:46px;border-radius:14px;background:var(--g);display:flex;align-items:center;justify-content:center}
.flag .ic{stroke:#fff;width:20px;height:20px}
.line{flex:1;min-width:0;position:relative;height:46px}
.line:before{content:"";position:absolute;left:8px;right:8px;top:50%;height:3px;margin-top:-1.5px;background:#eadfc9;border-radius:3px}
.fill{position:absolute;left:8px;top:50%;height:3px;margin-top:-1.5px;background:var(--g);border-radius:3px;transition:width .6s ease .2s}
.node{position:absolute;top:50%;width:24px;height:36px;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center}
.node i{width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid #e3d3b2;transition:transform .2s}
.node.done i{background:var(--g);border-color:var(--g)}
.node.cur i{width:19px;height:19px;background:#efae55;border:3px solid #fff;box-shadow:0 0 0 3px rgba(239,174,85,.35)}
.node:active i{transform:scale(1.25)}
.hint{text-align:center;color:var(--mute);font-size:12.5px;margin-top:20px}
/* congrats popup */
.coin-box{text-align:center;padding:0 20px 20px;overflow:hidden;background:linear-gradient(180deg,#eef0fb,#fff 55%)}
.art{position:relative;height:min(52vw,206px);margin:0 -20px}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art .shapes{opacity:0;transition:opacity .5s .25s}
.ov.on .art .shapes{opacity:1}
.art .medal{inset:auto;left:50%;top:12px;width:min(36vw,140px);height:auto;aspect-ratio:200/236;transform:translateX(-50%)}
.ov.on .medal{animation:pop .55s cubic-bezier(.2,.9,.3,1.35)}
.medal.lock{filter:grayscale(1) opacity(.45)}
@keyframes pop{from{transform:translateX(-50%) scale(.6) rotate(-8deg);opacity:0}to{transform:translateX(-50%);opacity:1}}
.coin-box h3{font-size:22px;font-weight:700;letter-spacing:.2px}
.coin-box .t2{font-size:14px;color:#8a93a0;margin:8px auto 20px;max-width:240px;line-height:1.45}
.coin-box .t2 b{color:var(--ink);font-weight:600}
.pink{background:linear-gradient(90deg,#e0558a,#ef6a63);box-shadow:0 10px 22px rgba(232,90,110,.35)}
/* game */
.game{position:fixed;inset:0;z-index:10;background:#1a2a33;display:none;justify-content:center}
.game.on{display:flex;animation:in .3s ease}
.gw{width:100%;max-width:430px;height:100%;padding:16px 18px 22px;display:flex;flex-direction:column;gap:clamp(12px,3dvh,26px);color:#fff}
.gt{display:flex;align-items:center;gap:10px}
.kb{width:46px;height:46px;border-radius:12px;background:#a8bec9;color:#1a2a33;box-shadow:0 5px 0 #6f8794;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .12s,box-shadow .12s}
.kb:active{transform:translateY(4px);box-shadow:0 1px 0 #6f8794}
.kb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pill{flex:1;min-width:0;height:46px;border-radius:12px;background:#1f3541;box-shadow:0 5px 0 #111f27;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;letter-spacing:1.5px;color:#a8bec9;font-size:15px}
.pill svg{width:20px;height:20px}
.gl{text-align:center}
.gl b{font-size:15px;font-weight:600;color:#a8bec9;letter-spacing:.5px}
.gd{display:flex;justify-content:center;gap:6px;margin-top:8px}
.gd i{width:18px;height:5px;border-radius:3px;background:#2b4452;transition:background .3s}
.gd i.d{background:#31c3bd}.gd i.c{background:#f2b137}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,4.2vw,18px);width:min(100%,46dvh);margin:0 auto;padding-bottom:6px}
.tile{aspect-ratio:1;border-radius:clamp(12px,4vw,16px);background:#1f3541;box-shadow:0 6px 0 #111f27;display:flex;align-items:center;justify-content:center;transition:transform .12s,box-shadow .12s,background .25s,opacity .3s}
.tile:active:not(.f){transform:translateY(4px);box-shadow:0 2px 0 #111f27}
.tile svg{width:54%;height:54%;animation:mk .28s cubic-bezier(.2,.9,.3,1.4)}
@keyframes mk{from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.tile.tx{color:#31c3bd}.tile.to{color:#f2b137}
.tile.win.tx{background:#31c3bd;color:#1a2a33}.tile.win.to{background:#f2b137;color:#1a2a33}
.tile.win{animation:bump .6s ease}
@keyframes bump{40%{transform:scale(1.07)}}
.tile.dim{opacity:.5}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:auto}
.sc{border-radius:12px;padding:12px 6px;text-align:center;color:#1a2a33}
.sc span{display:block;font-size:12.5px;font-weight:600;letter-spacing:.5px}
.sc b{font-size:22px;font-weight:700}
.sc.sx{background:#31c3bd}.sc.st{background:#a8bec9}.sc.so{background:#f2b137}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app"><div class="panel">

<!-- HOME -->
<section class="view on locked" id="home">
  <div class="top">
    <svg class="ic" viewBox="0 0 24 24"><path d="M5 9h14M5 15h9"/></svg>
    <h1>Tic Tac Toe</h1>
    <svg class="ic" viewBox="0 0 24 24"><path d="M13 3 6 13h5l-1 8 7-10h-5z"/></svg>
  </div>
  <div class="cards">
    <button class="card" id="playCard">Play Game
      <svg class="ci" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="card" id="lvlCard">Level Status
      <svg class="ci" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
  <div class="info" id="info">
    <div class="row"><span>Game ID</span><b id="iId">-</b></div>
    <div class="row"><span>Game</span><b id="iGame">-</b></div>
    <div class="row"><span>Status</span><b><i class="dot"></i>Activated</b></div>
  </div>
  <div class="spacer"></div>
  <button class="cta" id="verifyBtn">Enter verification code</button>
</section>

<!-- LEVEL STATUS -->
<section class="view" id="levels">
  <div class="lh">
    <button class="sq" id="back" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <div class="sq gi"><svg class="ic" viewBox="0 0 24 24"><path d="M9 4v16M15 4v16M4 9h16M4 15h16"/></svg></div>
    <div><small id="lGame">Tic Tac Toe</small><strong>Level Status</strong></div>
  </div>
  <div class="dial"><svg viewBox="0 0 360 360" id="ticks"></svg>
    <div class="c"><b id="cur">4</b><span>of 10 levels</span></div></div>
  <div class="lp">Level Progress</div>
  <div class="track">
    <div class="end"><div class="flag"><svg class="ic" viewBox="0 0 24 24"><path d="M6 21V4M6 5h11l-2 4 2 4H6"/></svg></div>Level 1</div>
    <div class="line"><div class="fill" id="fill"></div><div id="nodes"></div></div>
    <div class="end"><div class="flag"><svg class="ic" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 20h8"/></svg></div>Level 10</div>
  </div>
  <p class="hint">Tap a level to see its coins</p>
</section>

</div></div>

<!-- GAME -->
<section class="game" id="game"><div class="gw">
  <div class="gt">
    <button class="kb" id="gBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <div class="pill" id="pill"><span id="pIc"></span>TURN</div>
    <button class="kb" id="gSnd" aria-label="Sound"><svg viewBox="0 0 24 24" id="sndIc"></svg></button>
    <button class="kb" id="gRst" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg></button>
  </div>
  <div class="gl"><b id="gLvl">Level 1</b><div class="gd" id="gDots"></div></div>
  <div class="board" id="board"></div>
  <div class="score">
    <div class="sc sx"><span>X (YOU)</span><b id="sX">0</b></div>
    <div class="sc st"><span>TIES</span><b id="sT">0</b></div>
    <div class="sc so"><span>O (CPU)</span><b id="sO">0</b></div>
  </div>
</div></section>

<!-- VERIFY POPUP -->
<div class="ov top" id="vOv"><div class="box">
  <button class="x" id="vX" aria-label="Close">&times;</button>
  <h2>Enter your Game ID</h2>
  <p class="s">Example: CR-751196</p>
  <div class="id" id="idRow">
    <span class="b"></span><span class="b"></span><i>-</i><span class="b"></span><span class="b"></span><span class="b"></span><span class="b"></span><span class="b"></span><span class="b"></span>
    <input id="idIn" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="12" aria-label="Game ID">
  </div>
  <div class="msg" id="vMsg"></div>
  <button class="cta" id="vGo" disabled>Verify</button>
</div></div>

<!-- CONGRATS POPUP -->
<div class="ov" id="cOv"><div class="box coin-box">
  <button class="x" id="cX" aria-label="Close">&times;</button>
  <div class="art">
    <svg class="shapes" viewBox="0 0 340 206" preserveAspectRatio="xMidYMid meet">
      <defs><radialGradient id="bl" cx=".35" cy=".3"><stop offset="0" stop-color="#9fb0ff"/><stop offset="1" stop-color="#4f63e8"/></radialGradient></defs>
      <g fill="#ef6fa3"><rect x="34" y="52" width="38" height="12" rx="6"/><rect x="47" y="39" width="12" height="38" rx="6"/></g>
      <circle cx="52" cy="120" r="22" fill="url(#bl)"/>
      <circle cx="82" cy="158" r="9" fill="none" stroke="#b58be8" stroke-width="5"/>
      <circle cx="96" cy="30" r="11" fill="none" stroke="#d3d86a" stroke-width="6"/>
      <circle cx="262" cy="52" r="17" fill="none" stroke="#6f7cf0" stroke-width="11"/>
      <g fill="#cfd65f"><rect x="270" y="92" width="38" height="11" rx="5.5"/><rect x="283" y="79" width="11" height="38" rx="5.5"/></g>
      <circle cx="304" cy="30" r="8" fill="#b99cf5"/><circle cx="262" cy="150" r="6" fill="#f08bb0"/>
    </svg>
    <svg class="medal" id="medal" viewBox="0 0 200 236">
      <defs>
        <radialGradient id="gd" cx=".35" cy=".28"><stop offset="0" stop-color="#fff0a6"/><stop offset=".55" stop-color="#f9c94a"/><stop offset="1" stop-color="#e9a625"/></radialGradient>
        <linearGradient id="in" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9a625"/><stop offset="1" stop-color="#ffe58a"/></linearGradient>
        <clipPath id="rb"><path d="M64 112H136V224L100 202L64 224Z"/></clipPath>
        <linearGradient id="rs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".3" stop-color="#000" stop-opacity="0"/></linearGradient>
      </defs>
      <g clip-path="url(#rb)"><rect x="64" y="112" width="72" height="116" fill="#fff"/><rect x="64" y="112" width="20" height="116" fill="#e0558a"/><rect x="116" y="112" width="20" height="116" fill="#e0558a"/><rect x="64" y="112" width="72" height="116" fill="url(#rs)"/></g>
      <circle cx="100" cy="78" r="68" fill="url(#gd)"/>
      <circle cx="100" cy="78" r="54" fill="url(#in)"/>
      <circle cx="100" cy="78" r="54" fill="none" stroke="#fff3b8" stroke-opacity=".7" stroke-width="2.5"/>
      <polygon points="100,48 108.2,66.7 128.5,68.7 113.3,82.3 117.6,102.3 100,92 82.4,102.3 86.7,82.3 71.5,68.7 91.8,66.7" transform="translate(0 4)" fill="#d99a1e" stroke="#d99a1e" stroke-width="9" stroke-linejoin="round" opacity=".55"/>
      <polygon points="100,48 108.2,66.7 128.5,68.7 113.3,82.3 117.6,102.3 100,92 82.4,102.3 86.7,82.3 71.5,68.7 91.8,66.7" fill="#fff0a6" stroke="#fff0a6" stroke-width="9" stroke-linejoin="round"/>
      <ellipse cx="72" cy="38" rx="26" ry="10" transform="rotate(-35 72 38)" fill="#fff" opacity=".35"/>
    </svg>
  </div>
  <h3 id="cTitle">Congrats!</h3>
  <p class="t2" id="cTxt"></p>
  <button class="cta pink" id="cOk">Continue</button>
</div></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var GAMES={CR:'Car Racing',GS:'Gun Shoot',TT:'Tic Tac Toe'};
var TOTAL=10, P=[.05,.2,.3,.4,.5,.6,.7,.75,.8,.85]; // chance CPU plays its best move, per level

/* ---------- storage (swap these 3 functions for Firebase later: key = Game ID) ---------- */
var mem={};
function sget(k){var v=null;try{v=localStorage.getItem(k)}catch(e){}return v!==null?v:(mem[k]||null)}
function sset(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}
function load(id){try{var d=JSON.parse(sget('ttt:'+id));if(d&&d.coins)return d}catch(e){}return {coins:[],w:0,t:0,l:0}}
function save(){sset('ttt:'+S.id,JSON.stringify(S.d))}
var S={id:null,d:null,name:'Tic Tac Toe'};
function done(){return S.d?S.d.coins.length:0}

/* ---------- sound ---------- */
var AC=null,muted=sget('ttt:mute')==='1';
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t,d,type,v){var a=ac();if(!a||muted)return;var o=a.createOscillator(),g=a.createGain(),n=a.currentTime+t;
  o.type=type||'sine';o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v||.2,n+.012);g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+d+.05)}
var SND={
  x:function(){tone(620,0,.09,'triangle',.28);tone(930,.045,.09,'triangle',.18)},
  o:function(){tone(330,0,.12,'sine',.26);tone(247,.06,.12,'sine',.18)},
  win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,i*.11,.28,'triangle',.24)});tone(1047,.6,.5,'sine',.16);tone(1319,.6,.5,'sine',.14)},
  lose:function(){[392,330,262,196].forEach(function(f,i){tone(f,i*.16,.26,'sawtooth',.09)})},
  tie:function(){tone(392,0,.2,'triangle',.2);tone(392,.2,.3,'triangle',.2)},
  ui:function(){tone(500,0,.06,'triangle',.18)}
};
function sndIcon(){$('sndIc').innerHTML=muted?'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>':'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'}
$('gSnd').onclick=function(){muted=!muted;sset('ttt:mute',muted?'1':'0');sndIcon();SND.ui()};
sndIcon();

/* ---------- views / popups ---------- */
function show(id){['home','levels'].forEach(function(v){$(v).classList.toggle('on',v===id)})}
function openOv(o){o.classList.add('on')}
function closeOv(o){o.classList.remove('on')}

/* ---------- home ---------- */
var verified=false;
function unlock(id,anim){
  S.id=id;S.d=load(id);S.name=GAMES[id.slice(0,2)]||'Tic Tac Toe';verified=true;
  sset('ttt:session',id);
  $('iId').textContent=id.slice(0,2)+'-'+id.slice(2);$('iGame').textContent=S.name;
  $('home').classList.remove('locked');
  if(anim){$('verifyBtn').classList.add('gone');setTimeout(function(){$('info').classList.add('show');$('verifyBtn').style.display='none'},250)}
  else{$('info').style.transition='none';$('info').classList.add('show');$('verifyBtn').style.display='none'}
}
function needCode(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');openVerify()}
$('playCard').onclick=function(){if(!verified)return needCode(this);ac();openGame()};
$('lvlCard').onclick=function(){if(!verified)return needCode(this);$('lGame').textContent=S.name;renderLevels();show('levels')};
$('back').onclick=function(){show('home')};

/* ---------- verification popup ---------- */
var inp=$('idIn'),bx=[].slice.call(document.querySelectorAll('#idRow .b'));
function clean(t){t=t.toUpperCase().replace(/[^A-Z0-9]/g,'');var o='';for(var i=0;i<t.length&&o.length<8;i++){var ch=t[i];if(o.length<2){if(/[A-Z]/.test(ch))o+=ch}else if(/[0-9]/.test(ch))o+=ch}return o}
function paint(){var v=inp.value,f=document.activeElement===inp;bx.forEach(function(b,i){b.textContent=v[i]||'';b.classList.toggle('act',f&&i===Math.min(v.length,7))});$('vGo').disabled=v.length<8}
function openVerify(){inp.value='';$('vMsg').textContent='';$('idRow').classList.remove('err');paint();openOv($('vOv'));setTimeout(function(){inp.focus()},120)}
$('verifyBtn').onclick=openVerify;
$('vX').onclick=function(){inp.blur();closeOv($('vOv'))};
$('vOv').addEventListener('click',function(e){if(e.target===this){inp.blur();closeOv(this)}});
inp.addEventListener('input',function(){inp.value=clean(inp.value);$('vMsg').textContent='';$('idRow').classList.remove('err');paint()});
inp.addEventListener('focus',paint);inp.addEventListener('blur',paint);
inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!$('vGo').disabled)submit()});
function submit(){
  var c=inp.value;
  if(!/^[A-Z]{2}\d{6}$/.test(c)){$('idRow').classList.add('err');$('vMsg').textContent='Enter 2 letters and 6 digits.';return}
  inp.blur();closeOv($('vOv'));unlock(c,true);
}
$('vGo').onclick=submit;

/* ---------- level status ---------- */
var ticks=[],nodes=[];
(function(){
  var sv=$('ticks'),ns='http://www.w3.org/2000/svg',N=60;
  for(var i=0;i<N;i++){
    var a=i/N*2*Math.PI-Math.PI/2,r1=138,r2=i%5===0?168:158;
    var l=document.createElementNS(ns,'line');l.setAttribute('class','t');
    l.setAttribute('x1',180+r1*Math.cos(a));l.setAttribute('y1',180+r1*Math.sin(a));
    l.setAttribute('x2',180+r2*Math.cos(a));l.setAttribute('y2',180+r2*Math.sin(a));
    sv.appendChild(l);ticks.push(l);
  }
  for(var n=1;n<=TOTAL;n++){
    var b=document.createElement('button');b.className='node';
    b.style.left='calc(8px + (100% - 16px) * '+((n-1)/(TOTAL-1))+')';
    b.innerHTML='<i></i>';b.setAttribute('aria-label','Level '+n);
    b.onclick=(function(n){return function(){coinsPopup(n)}})(n);
    $('nodes').appendChild(b);nodes.push(b);
  }
})();
function renderLevels(){
  var c=done();$('cur').textContent=c;
  nodes.forEach(function(b,i){b.className='node'+(i<c?' done':i===c?' cur':'')});
  var on=Math.round(ticks.length*c/TOTAL);
  ticks.forEach(function(t){t.classList.remove('on');t.style.transitionDelay='0s'});
  $('fill').style.transition='none';$('fill').style.width='0px';
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    ticks.forEach(function(t,i){if(i<on){t.style.transitionDelay=(i*.022)+'s';t.classList.add('on')}});
    $('fill').style.transition='';$('fill').style.width='calc((100% - 16px) * '+(Math.min(c,TOTAL-1)/(TOTAL-1))+')';
  })});
}

/* ---------- result / coins popup ---------- */
var popCb=null;
function popup(o){
  $('medal').classList.toggle('lock',!!o.locked);
  $('cTitle').textContent=o.title;$('cTxt').innerHTML=o.text;$('cOk').textContent=o.btn||'Continue';
  popCb=o.cb||null;var el=$('cOv');el.classList.remove('on');void el.offsetWidth;openOv(el);
}
function popClose(){closeOv($('cOv'));var f=popCb;popCb=null;if(f)f()}
$('cX').onclick=popClose;$('cOk').onclick=popClose;
$('cOv').addEventListener('click',function(e){if(e.target===this)popClose()});
function coinsPopup(n){
  var c=done();
  if(n<=c)popup({title:'Congrats!',text:'You collected <b>'+S.d.coins[n-1]+' coins</b> in Level '+n+'.'});
  else if(n===c+1)popup({locked:1,title:'Level '+n,text:'Win this level to collect coins.'});
  else popup({locked:1,title:'Level '+n+' locked',text:'Complete Level '+(n-1)+' first.'});
}

/* ---------- game ---------- */
var LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
var MX='<svg viewBox="0 0 40 40"><path d="M9 9L31 31M31 9L9 31" stroke="currentColor" stroke-width="8" stroke-linecap="round" fill="none"/></svg>';
var MO='<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="12" fill="none" stroke="currentColor" stroke-width="8"/></svg>';
var G={b:[],lock:true,lvl:1,xm:0},tiles=[];
(function(){for(var i=0;i<9;i++){var t=document.createElement('button');t.className='tile';t.setAttribute('aria-label','Cell '+(i+1));
  t.onclick=(function(i){return function(){humanMove(i)}})(i);$('board').appendChild(t);tiles.push(t)}
  for(var d=0;d<TOTAL;d++)$('gDots').appendChild(document.createElement('i'))})();
function win(b){for(var i=0;i<8;i++){var l=LINES[i];if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[0]]===b[l[2]])return {p:b[l[0]],l:l}}return null}
function empties(b){var e=[];for(var i=0;i<9;i++)if(!b[i])e.push(i);return e}
function mm(b,turn){var w=win(b),e=empties(b);if(w)return w.p==='O'?1+e.length:-1-e.length;if(!e.length)return 0;
  var best=turn==='O'?-99:99;for(var k=0;k<e.length;k++){b[e[k]]=turn;var v=mm(b,turn==='O'?'X':'O');b[e[k]]='';
    if(turn==='O'?v>best:v<best)best=v}return best}
function cpuPick(){
  var e=empties(G.b);
  if(Math.random()>P[G.lvl-1]||e.length===9)return e[Math.floor(Math.random()*e.length)];
  var best=-99,pick=[];
  e.forEach(function(i){G.b[i]='O';var v=mm(G.b,'X');G.b[i]='';if(v>best){best=v;pick=[i]}else if(v===best)pick.push(i)});
  return pick[Math.floor(Math.random()*pick.length)];
}
function setPill(t){$('pIc').innerHTML=t==='X'?'<span style="color:#31c3bd">'+MX+'</span>':'<span style="color:#f2b137">'+MO+'</span>';$('pIc').firstChild.style.display='flex'}
function paintScore(){$('sX').textContent=S.d.w;$('sT').textContent=S.d.t;$('sO').textContent=S.d.l}
function paintLevel(){
  $('gLvl').textContent='Level '+G.lvl+' of '+TOTAL;
  [].forEach.call($('gDots').children,function(d,i){d.className=i<done()?'d':i===G.lvl-1?'c':''});
}
function round(){
  G.b=['','','','','','','','',''];G.lock=false;G.xm=0;
  tiles.forEach(function(t){t.className='tile';t.innerHTML=''});
  setPill('X');paintScore();paintLevel();
}
function openGame(){G.lvl=Math.min(done()+1,TOTAL);$('game').classList.add('on');round()}
$('gBack').onclick=function(){SND.ui();$('game').classList.remove('on');G.lock=true};
$('gRst').onclick=function(){SND.ui();if(!$('cOv').classList.contains('on'))round()};
function place(p,i){G.b[i]=p;var t=tiles[i];t.className='tile f '+(p==='X'?'tx':'to');t.innerHTML=p==='X'?MX:MO;(p==='X'?SND.x:SND.o)()}
function humanMove(i){
  if(G.lock||G.b[i])return;ac();
  G.xm++;place('X',i);
  if(finish())return;
  G.lock=true;setPill('O');
  setTimeout(function(){if(!$('game').classList.contains('on'))return;place('O',cpuPick());if(finish())return;G.lock=false;setPill('X')},520+Math.random()*260);
}
function finish(){
  var w=win(G.b),full=!empties(G.b).length;
  if(!w&&!full)return false;
  G.lock=true;
  tiles.forEach(function(t,i){t.classList.add('f');if(w&&w.l.indexOf(i)<0)t.classList.add('dim')});
  if(w)w.l.forEach(function(i){tiles[i].classList.add('win')});
  if(w&&w.p==='X'){
    S.d.w++;var coins=50+G.lvl*10+(6-G.xm)*10,idx=G.lvl-1;
    if(S.d.coins[idx]===undefined)S.d.coins[idx]=coins;else S.d.coins[idx]=Math.max(S.d.coins[idx],coins);
    save();paintScore();paintLevel();
    setTimeout(SND.win,250);
    setTimeout(function(){
      var last=G.lvl>=TOTAL;
      popup({title:last?'All levels complete!':'Level '+G.lvl+' complete!',text:'You collected <b>'+coins+' coins</b>.'+(last?'':' Ready for Level '+(G.lvl+1)+'?'),btn:last?'Back to menu':'Next Level',
        cb:function(){if(last){$('game').classList.remove('on')}else{G.lvl++;round()}}});
    },1100);
  }else{
    var lost=!!w;if(lost)S.d.l++;else S.d.t++;save();paintScore();
    setTimeout(lost?SND.lose:SND.tie,250);
    setTimeout(function(){popup({locked:1,title:lost?'CPU won this round':'It\u2019s a tie',text:'Try Level '+G.lvl+' again.',btn:'Try again',cb:round})},1000);
  }
  return true;
}

/* ---------- boot: restore saved Game ID ---------- */
var sid=sget('ttt:session');if(sid&&/^[A-Z]{2}\d{6}$/.test(sid))unlock(sid,false);
})();
</script>
